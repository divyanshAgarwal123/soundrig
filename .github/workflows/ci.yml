name: SoundRig checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soundrig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline regression (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test runner failure and isolation paths
        run: |
          python3 ci/test_check.py
          python3 ci/test_native_receipt.py
          python3 ci/test_review_gate.py
      - name: Run all SoundRig suites with an owned offline server
        run: python3 ci/check.py --timeout 900
      - name: Preserve receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ github.sha }}
          path: .qa-output/latest/
          if-no-files-found: error
          retention-days: 30

  native:
    name: Native Godot integration (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download and verify official Godot 4.7.2
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 2 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Verify kit and existing-game integration
        env:
          GODOT: ${{ runner.temp }}/godot
        run: |
          mkdir -p .qa-output/native
          python3 verify-godot.py --godot "$GODOT" --archive fixtures/revision-browser-godot.zip > .qa-output/native/kit.log 2>&1
          cp evidence/practical-godot-engine.json .qa-output/native/kit.json
          "$GODOT" --headless --audio-driver Dummy --path integration-proof/godot-platformer --editor --import > .qa-output/native/import.log 2>&1
          "$GODOT" --headless --audio-driver Dummy --path integration-proof/godot-platformer --script test_soundrig_integration.gd > .qa-output/native/game.log 2>&1
      - name: Record native success or failure
        if: always()
        run: python3 ci/native_receipt.py --job-status '${{ job.status }}'
      - name: Preserve native receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ github.sha }}
          path: .qa-output/native/
          if-no-files-found: error
          retention-days: 30
